services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://qaveil:qaveil@db:5432/qaveil?schema=public
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qaveil
      POSTGRES_USER: qaveil
      POSTGRES_PASSWORD: qaveil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaveil -d qaveil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
